services:
  postgres:
    image: postgres:16-alpine
    container_name: biomed-cmms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biomed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biomed}
      POSTGRES_DB: ${POSTGRES_DB:-biomed_cmms}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biomed} -d ${POSTGRES_DB:-biomed_cmms}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
